name: checks

# The query audit is the reason this file exists.
#
# Three separate bugs shipped from one class: a PostgREST filter on a column
# that does not exist. Postgres rejects the query, the SDK turns the error into
# a null, and the branch takes its "not found" path forever without erroring —
# so the sender allowlist never admitted a customer, inbound mail was never
# attributed to a contact, and no meeting attendee was ever matched.
#
# The test suite could not catch any of them: the doubles accepted whatever
# column the query asked for. A mock more permissive than the database does not
# test the query, it agrees with it. Checking the queries against the schema is
# the only thing that finds this shape.
#
# THE RULE THIS FILE IS HELD TO
# A verification that cannot report failure is not a verification.
#
# Three checks have failed that test. A mock more permissive than the database
# agreed with the query instead of testing it. A schema snapshot nobody
# refreshed could not disagree with the code. A typecheck step carried
# `continue-on-error: true`, reporting a green tick while exiting 2.
#
# All three read as coverage on the dashboard and none could ever have said no.
# So: no `continue-on-error` in this file, and any step that cannot reach a
# real verdict fails rather than passes.

on:
  pull_request:
  push:
    branches: [development, main]

jobs:
  query-columns:
    name: queries match the schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runs against db/schema-columns.json, not a live database: Railway's
      # Postgres is not reachable from CI. That makes the snapshot a dependency
      # with a staleness risk, which the next job is about.
      - name: Audit PostgREST column references
        run: python scripts/audit-query-columns.py

  schema-snapshot-fresh:
    name: schema snapshot matches the migrations
    runs-on: ubuntu-latest
    # Only on pull requests. The check compares a PR against its base, so on a
    # push there is nothing to compare and it used to exit 0 with "not a PR —
    # skipping" — a green tick for a check that never ran. A skipped job reads
    # as skipped; a passing job should mean it passed.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A snapshot nobody refreshes silently stops checking anything: new
      # columns read as missing, and worse, a dropped column still reads as
      # present. So a PR that adds a migration must also touch the snapshot.
      #
      # Deliberately dumb — it compares which files changed, not their contents.
      # A real schema diff needs a database, which is what CI does not have.
      - name: Require a snapshot update alongside a new migration
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          # The job is gated to pull_request events, so an empty base means the
          # event payload or the checkout is wrong — not a reason to pass.
          if [ -z "$BASE" ]; then
            echo "No base SHA on a pull_request event — this check cannot reach"
            echo "a real verdict, so it fails rather than passes."
            exit 1
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          if echo "$CHANGED" | grep -q '^db/alembic/versions/'; then
            if ! echo "$CHANGED" | grep -q '^db/schema-columns.json$'; then
              echo "This PR adds or edits a migration but does not update"
              echo "db/schema-columns.json."
              echo
              echo "Regenerate it against the migrated database, or the column"
              echo "audit will be checking yesterday's schema and will miss"
              echo "exactly the bug it exists to catch."
              exit 1
            fi
          fi
          echo "OK"

  unit:
    name: tests, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. package.json already pins
      # packageManager: pnpm@10.28.0, and action-setup treats two sources as
      # an error rather than picking one — "Multiple versions of pnpm
      # specified". packageManager is the better source: it is what every
      # developer already resolves through corepack, so CI and local cannot
      # drift apart.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run

      # Build BEFORE typecheck, which looks backwards and is not.
      #
      # `next-env.d.ts` is gitignored and generated by `next build`. It is what
      # pulls in Next's ambient types, and without it every SVGR icon component
      # loses its props — `className` stops existing on 14 of them, in files
      # nobody touched. A fresh CI checkout has no such file, so running tsc
      # first checks a program that is missing its type roots and fails on code
      # that is completely fine.
      #
      # It passed locally throughout because a previous build had left the file
      # behind. That is the whole class of bug this workflow exists to catch:
      # a check whose result depends on state the checkout does not carry.
      - run: pnpm build

      # Blocking. It was briefly non-blocking to carry 23 pre-existing errors in
      # permissions.test.ts; those are fixed, and a step that reports a green
      # tick while exiting 2 is worse than no step at all — the job goes green,
      # nobody opens the log, and the next real type error rides in behind it.
      #
      # Still worth running separately after the build: `next build` typechecks
      # the app, but not the test files.
      - run: pnpm exec tsc --noEmit
