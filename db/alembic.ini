# Alembic configuration for George's schema.
#
# There is deliberately NO sqlalchemy.url here. The URL comes from DATABASE_URL
# at run time (see alembic/env.py), because a default connection string sitting
# in a committed file is how someone eventually migrates the wrong database.
# env.py refuses to run without it.

[alembic]
script_location = alembic

# Zero-padded sequence + slug, so the versions/ directory sorts in the order
# history actually runs. Alembic's default random hex ids make a folder listing
# useless for answering "what ran before what".
file_template = %%(rev)s_%%(slug)s

# Revisions are written and reviewed by hand; keep them out of any timezone
# ambiguity in the header comment.
timezone = UTC

prepend_sys_path = .

[post_write_hooks]
# None. Formatting a migration automatically risks rewriting SQL inside a
# string literal, and these files are small enough to keep tidy by hand.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# INFO so an operator sees each revision as it is applied — this output is the
# record of what a production run actually did.
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
